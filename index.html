                {id:'t2',name:'كارت شحن 25 ج.م',price:25,unit:'عدد',img:'📱',quantity:40},
                {id:'t3',name:'كارت شحن 50 ج.م',price:50,unit:'عدد',img:'📱',quantity:30},

    const DEFAULT_USERS = [
        { username: 'admin', password: 'admin123', type: 'مدير', fullname: 'مدير النظام', phone: '' },
        { username: 'seller', password: 'seller123', type: 'بائع', fullname: 'البائع الافتراضي', phone: '' },
        { username: 'buyer', password: 'buyer123', type: 'مشتري', fullname: 'مشتري تجريبي', phone: '' }
    ];

    function loadData() {
        let users = localStorage.getItem('bakala_users');
        let categories = localStorage.getItem('bakala_categories');
        let companyName = localStorage.getItem('bakala_company_name');
        let companyLogo = localStorage.getItem('bakala_company_logo');
        let adminWhatsapp = localStorage.getItem('bakala_admin_whatsapp');
        let paymentNumber = localStorage.getItem('bakala_payment_number');
        let cart = localStorage.getItem('bakala_cart');
        let rememberedUser = localStorage.getItem('bakala_remembered_user');
        let pending = localStorage.getItem('bakala_pending_users');
        let orders = localStorage.getItem('bakala_orders');
        let archive = localStorage.getItem('bakala_sales_archive');
        
        if (!users) { localStorage.setItem('bakala_users', JSON.stringify(DEFAULT_USERS)); users = JSON.stringify(DEFAULT_USERS); }
        if (!categories) { localStorage.setItem('bakala_categories', JSON.stringify(getDefaultCategories())); categories = JSON.stringify(getDefaultCategories()); }
        if (!companyName) localStorage.setItem('bakala_company_name', 'بقالة الخير');
        if (!companyLogo) localStorage.setItem('bakala_company_logo', '🛒');
        if (!adminWhatsapp) localStorage.setItem('bakala_admin_whatsapp', '');
        if (!paymentNumber) localStorage.setItem('bakala_payment_number', '');
        if (!cart) localStorage.setItem('bakala_cart', JSON.stringify([]));
        if (!pending) localStorage.setItem('bakala_pending_users', JSON.stringify([]));
        if (!orders) localStorage.setItem('bakala_orders', JSON.stringify([]));
        if (!archive) localStorage.setItem('bakala_sales_archive', JSON.stringify([]));

        return {
            users: JSON.parse(users),
            categories: JSON.parse(categories),
            companyName, companyLogo, adminWhatsapp, paymentNumber,
            cart: JSON.parse(cart || '[]'),
            rememberedUser: rememberedUser || '',
            pending: JSON.parse(pending),
            orders: JSON.parse(orders),
            archive: JSON.parse(archive)
        };
    }

    function saveUsers(u) { localStorage.setItem('bakala_users', JSON.stringify(u)); }
    function saveCategories(c) { localStorage.setItem('bakala_categories', JSON.stringify(c)); }
    function saveCart(c) { localStorage.setItem('bakala_cart', JSON.stringify(c)); }
    function getCart() { return JSON.parse(localStorage.getItem('bakala_cart') || '[]'); }
    function savePendingUsers(p) { localStorage.setItem('bakala_pending_users', JSON.stringify(p)); }
    function getPendingUsers() { return JSON.parse(localStorage.getItem('bakala_pending_users') || '[]'); }
    function getOrders() { return JSON.parse(localStorage.getItem('bakala_orders') || '[]'); }
    function saveOrders(o) { localStorage.setItem('bakala_orders', JSON.stringify(o)); }
    function getArchive() { return JSON.parse(localStorage.getItem('bakala_sales_archive') || '[]'); }
    function saveArchive(a) { localStorage.setItem('bakala_sales_archive', JSON.stringify(a)); }

    let currentUser = null;
    let qtyPopupData = null;
    let pendingAcceptIndex = null;
    let editingCategoryId = null;
    let activeCategoryForProducts = null;

    function showToast(msg, type='info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        if(type==='error') toast.style.background = 'var(--red)';
        else if(type==='success') toast.style.background = 'var(--primary)';
        else if(type==='warning') toast.style.background = 'var(--gold)';
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function closeModal(id) {
        const el = document.getElementById(id);
        if(el) el.classList.remove('show');
    }
    function closeModalOutside(e, id) {
        if(e.target === document.getElementById(id)) closeModal(id);
    }

    // ==================== INIT ====================
    window.onload = function() {
        init();
    };

    function init() {
        const data = loadData();
        document.getElementById('header-company-name').textContent = data.companyName;
        document.getElementById('login-logo').textContent = data.companyLogo;
        document.getElementById('header-logo').textContent = data.companyLogo;
        document.getElementById('company-name-input').value = data.companyName;
        document.getElementById('company-logo-input').value = data.companyLogo;
        document.getElementById('admin-whatsapp-input').value = data.adminWhatsapp || '';
        document.getElementById('company-payment-number').value = data.paymentNumber || '';
        
        if (data.rememberedUser) {
            document.getElementById('login-username').value = data.rememberedUser;
            document.getElementById('remember-me').checked = true;
        }

        renderCategories(data.categories);
        updateCartBadge();
        updatePendingBadge();
        updateOrdersBadge();

        document.getElementById('toggle-password').addEventListener('click', function(){
            const pw = document.getElementById('login-password');
            if(pw.type === 'password') { pw.type = 'text'; this.textContent = '🙈'; }
            else { pw.type = 'password'; this.textContent = '👁️'; }
        });

        document.getElementById('payment-method').addEventListener('change', function() {
            const val = this.value;
            const group = document.getElementById('payment-upload-group');
            if(val === 'محفظة إلكترونية' || val === 'انستاباي') { 
                group.style.display = 'block'; 
            } else { 
                group.style.display = 'none'; 
            }
        });

        renderOrdersList();
        renderArchiveList();
    };

    function showScreen(id) {
        if (!currentUser && id !== 'login' && id !== 'register') {
            id = 'login';
        }

        if (currentUser) {
            if (id === 'settings' && currentUser.type !== 'مدير') {
                showToast('⚠️ غير مصرح لك بدخول الإعدادات', 'error');
                return;
            }
            if (id === 'orders' && currentUser.type === 'مشتري') {
                showToast('⚠️ غير مصرح لك بدخول طلبات المشتريات', 'error');
                return;
            }
            if (id === 'archive' && currentUser.type === 'مشتري') {
                showToast('⚠️ غير مصرح لك بدخول أرشيف حركة البيع', 'error');
                return;
            }
        }

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const targetScreen = document.getElementById(id + '-screen');
        if (targetScreen) targetScreen.classList.add('active');

        closeFloatingMenu();
        document.getElementById('products-overlay').classList.remove('show');
        document.getElementById('cart-overlay').classList.remove('show');

        if(id === 'orders') renderOrdersList();
        if(id === 'archive') renderArchiveList();
        if(id === 'buyer-archive') renderBuyerArchive();
    }

    function backToMain() { 
        showScreen('main'); 
        updateHeaderInfo(); 
        renderCategories(loadData().categories); 
        updateCartBadge(); 
        updatePendingBadge(); 
        updateOrdersBadge(); 
    }

    function updateHeaderInfo() {
        if(currentUser) {
            document.getElementById('header-user-info').textContent = `${currentUser.type} | ${currentUser.username}`;
            document.getElementById('header-company-name').textContent = localStorage.getItem('bakala_company_name')||'بقالة الخير';
            document.getElementById('header-logo').textContent = localStorage.getItem('bakala_company_logo')||'🛒';

            const ordersBtn = document.getElementById('header-btn-orders');
            const cartBtn = document.getElementById('header-btn-cart');
            const pendingBtn = document.getElementById('header-btn-pending');

            if (currentUser.type === 'مدير') {
                if (ordersBtn) ordersBtn.style.display = 'flex';
                if (cartBtn) cartBtn.style.display = 'flex';
                if (pendingBtn) pendingBtn.style.display = 'flex';
            } else if (currentUser.type === 'بائع') {
                if (ordersBtn) ordersBtn.style.display = 'flex';
                if (cartBtn) cartBtn.style.display = 'none';
                if (pendingBtn) pendingBtn.style.display = 'none';
            } else if (currentUser.type === 'مشتري') {
                if (ordersBtn) ordersBtn.style.display = 'none';
                if (cartBtn) cartBtn.style.display = 'flex';
                if (pendingBtn) pendingBtn.style.display = 'none';
            }
            renderFloatingMenu();
        }
    }

    // ==================== FLOATING MENU BY ROLE ====================
    function renderFloatingMenu() {
        const menu = document.getElementById('floating-menu');
        if (!currentUser) return;

        let html = '';
        if (currentUser.type === 'مدير') {
            html = `
                <button onclick="openSettings()">⚙️ الإعدادات</button>
                <button onclick="openPendingRequests()">📩 طلبات التسجيل</button>
                <button onclick="showScreen('orders')">📦 كل الطلبات</button>
                <button onclick="showScreen('archive')">📦 أرشيف حركة البيع</button>
                <div class="divider"></div>
                <button onclick="handleLogout()">🚪 تسجيل الخروج</button>
            `;
        } else if (currentUser.type === 'بائع') {
            html = `
                <button onclick="showScreen('orders')">📦 طلبات المشتريات</button>
                <button onclick="showScreen('archive')">📦 أرشيف حركة البيع</button>
                <div class="divider"></div>
                <button onclick="handleLogout()">🚪 تسجيل الخروج</button>
            `;
        } else if (currentUser.type === 'مشتري') {
            html = `
                <button onclick="toggleCart()">🛒 سلة المشتريات</button>
                <button onclick="showScreen('buyer-archive')">📋 أرشيف مشترياتي</button>
                <div class="divider"></div>
                <button onclick="handleLogout()">🚪 تسجيل الخروج</button>
            `;
        }
        menu.innerHTML = html;
    }

    // ==================== LOGIN / LOGOUT ====================
    function handleLogin() {
        const u = document.getElementById('login-username').value.trim();
        const p = document.getElementById('login-password').value.trim();
        const rem = document.getElementById('remember-me').checked;
        if(!u||!p) return showToast('⚠️ يرجى إدخال اسم المستخدم وكلمة السر','error');
        const data = loadData();
        const user = data.users.find(x => x.username===u && x.password===p);
        if(user) {
            currentUser = user;
            if(rem) localStorage.setItem('bakala_remembered_user', u);
            else localStorage.removeItem('bakala_remembered_user');
            updateHeaderInfo();
            showScreen('main');
            renderCategories(data.categories);
            updateCartBadge();
            updatePendingBadge();
            updateOrdersBadge();
            showToast(`👋 مرحباً ${user.username}!`,'success');
        } else showToast('❌ اسم المستخدم أو كلمة السر غير صحيحة','error');
    }

    function handleLogout() {
        currentUser = null;
        closeFloatingMenu();
        showScreen('login');
        document.getElementById('login-password').value = '';
        showToast('👋 تم تسجيل الخروج بنجاح','success');
    }

    // ==================== REGISTER REQUESTS ====================
    function requestRegistration() {
        const fullname = document.getElementById('reg-fullname').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const resultDiv = document.getElementById('register-result');

        if (!fullname || !phone) {
            return showToast('⚠️ يرجى إدخال الاسم ورقم الهاتف', 'error');
        }

        const pending = getPendingUsers();
        const now = new Date();
        const dateStr = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG');

        pending.push({
            fullname: fullname,
            phone: phone,
            date: dateStr
        });

        savePendingUsers(pending);
        document.getElementById('reg-fullname').value = '';
        document.getElementById('reg-phone').value = '';

        if (resultDiv) {
            resultDiv.textContent = '✅ تم إرسال طلبك بنجاح! سيتم مراجعته من قبل المدير.';
        }
        showToast('✅ تم إرسال طلب التسجيل بنجاح', 'success');
        updatePendingBadge();
    }

    // ==================== CATEGORIES & PRODUCTS (MAIN SCREEN) ====================
    function renderCategories(cats) {
        const grid = document.getElementById('categories-grid');
        grid.innerHTML = cats.map(c=>`<div class="category-card" onclick="openCategoryProducts('${c.id}')"><span class="category-icon">${c.icon}</span><span class="category-name">${c.name}</span></div>`).join('');
    }

    function openCategoryProducts(catId) {
        const data = loadData();
        const cat = data.categories.find(c=>c.id===catId);
        if(!cat) return;
        document.getElementById('products-overlay-title').innerHTML = `${cat.icon} ${cat.name}`;
        const body = document.getElementById('products-overlay-body');
        if(cat.products && cat.products.length) {
            body.innerHTML = `
            <table class="products-table"><thead><tr><th>🖼️ صورة</th><th>📝 اسم المنتج</th><th>💰 السعر</th><th>📦 المتاح</th><th>⚡ الإجراءات</th></tr></thead>
            <tbody>${cat.products.map(p => {
                const disabled = p.quantity <= 0;
                const unitStr = p.unit || 'عدد';
                return `<tr>
                    <td class="product-img-cell"><div class="product-img">${p.img||'📦'}</div></td>
                    <td><strong>${p.name}</strong></td>
                    <td><span class="product-price">${p.price} ج.م / ${unitStr}</span></td>
                    <td><span class="product-qty">${p.quantity} ${unitStr}</span></td>
                    <td><button class="btn-add-cart" onclick="openQtyPopup('${catId}','${p.id}')" ${disabled?'disabled':''}>${disabled ? '❌ نافذ' : '🛒 أضف للسلة'}</button></td>
                </tr>`;
            }).join('')}</tbody></table>`;
        } else { body.innerHTML = '<div style="text-align:center;padding:30px;">📭 لا توجد منتجات في هذا القسم</div>'; }
        document.getElementById('products-overlay').classList.add('show');
    }

    function closeProductsOverlay() { document.getElementById('products-overlay').classList.remove('show'); }

    // ==================== QUANTITY POPUP ====================
    function openQtyPopup(categoryId, productId) {
        const data = loadData();
        const cat = data.categories.find(c => c.id === categoryId);
        if(!cat) return;
        const prod = cat.products.find(p => p.id === productId);
        if(!prod) return;
        if(prod.quantity <= 0) { showToast('❌ الكمية غير متوفرة','error'); return; }
        const unitStr = prod.unit || 'عدد';
        qtyPopupData = { categoryId, productId, product: prod, maxQty: prod.quantity, unit: unitStr };
        document.getElementById('qty-popup-name').textContent = `${prod.img||'📦'} ${prod.name}`;
        document.getElementById('qty-popup-sub').innerHTML = `الكمية المتاحة: <span id="qty-available">${prod.quantity}</span> ${unitStr}`;
        document.getElementById('qty-input').value = 1;
        updateQtyTotal();
        document.getElementById('qty-popup-overlay').classList.add('show');
    }

    function closeQtyPopup() { document.getElementById('qty-popup-overlay').classList.remove('show'); qtyPopupData = null; }
    function closeQtyPopupOutside(e) { if(e.target === document.getElementById('qty-popup-overlay')) closeQtyPopup(); }

    function changeQty(delta) {
        const input = document.getElementById('qty-input');
        let val = parseInt(input.value) || 1;
        val = Math.max(1, val + delta);
        if(qtyPopupData && val > qtyPopupData.maxQty) { showToast(`⚠️ المتاح ${qtyPopupData.maxQty} فقط`,'error'); val = qtyPopupData.maxQty; }
        input.value = val;
        updateQtyTotal();
    }

    function updateQtyTotal() {
        const input = document.getElementById('qty-input');
        const qty = parseInt(input.value) || 1;
        if(qtyPopupData) {
            const total = qty * qtyPopupData.product.price;
            document.getElementById('qty-total').textContent = `السعر الإجمالي: ${total} ج.م`;
        }
    }

    function confirmAddToCart() {
        if(!qtyPopupData) return;
        const input = document.getElementById('qty-input');
        let qty = parseInt(input.value) || 1;
        if(qty <= 0) qty = 1;
        const data = loadData();
        const cat = data.categories.find(c => c.id === qtyPopupData.categoryId);
        if(!cat) return;
        const prod = cat.products.find(p => p.id === qtyPopupData.productId);
        if(!prod || prod.quantity < qty) { showToast(`⚠️ الكمية المتاحة ${prod?prod.quantity:0} فقط`,'error'); return; }

        prod.quantity -= qty;
        saveCategories(data.categories);

        let cart = getCart();
        const unitStr = prod.unit || 'عدد';
        const existing = cart.find(i => i.categoryId === qtyPopupData.categoryId && i.productId === qtyPopupData.productId);
        if(existing) existing.quantity += qty;
        else cart.push({ categoryId: qtyPopupData.categoryId, productId: qtyPopupData.productId, name: prod.name, price: prod.price, unit: unitStr, img: prod.img||'📦', quantity: qty });
        
        saveCart(cart);
        updateCartBadge();
        closeQtyPopup();
        showToast(`✅ تمت إضافة ${qty} ${unitStr} إلى السلة`,'success');
        if(document.getElementById('products-overlay').classList.contains('show')) openCategoryProducts(qtyPopupData.categoryId);
    }

    // ==================== CART ====================
    function toggleCart() {
        const overlay = document.getElementById('cart-overlay');
        if(overlay.classList.contains('show')) overlay.classList.remove('show');
        else { renderCart(); overlay.classList.add('show'); }
        closeFloatingMenu();
        const paymentNum = localStorage.getItem('bakala_payment_number') || 'غير محدد في الإعدادات';
        document.getElementById('company-transfer-number').textContent = paymentNum;
    }

    function closeCartOutside(e) { if(e.target===document.getElementById('cart-overlay')) document.getElementById('cart-overlay').classList.remove('show'); }

    function renderCart() {
        const cart = getCart();
        const body = document.getElementById('cart-panel-body');
        const totalDiv = document.getElementById('cart-total');
        const totalAmt = document.getElementById('cart-total-amount');
        const checkout = document.getElementById('checkout-section');
        
        if(!cart.length) { 
            body.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-500);">🛒<br>السلة فارغة</div>'; 
            totalDiv.style.display='none'; 
            checkout.style.display='none'; 
        } else {
            body.innerHTML = cart.map((item,i)=>`
                <div class="cart-item">
                    <span class="cart-item-img">${item.img||'📦'}</span>
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <span class="price">${item.price} ج.م / ${item.unit||'عدد'} × ${item.quantity} ${item.unit||'عدد'} = ${item.price*item.quantity} ج.م</span>
                    </div>
                    <div class="cart-item-actions">
                        <button class="qty-btn" onclick="changeCartQty(${i},-1)">−</button>
                        <span>${item.quantity}</span>
                        <button class="qty-btn" onclick="changeCartQty(${i},1)">+</button>
                        <button class="remove-btn" onclick="removeCartItem(${i})">🗑️</button>
                    </div>
                </div>`).join('');
            totalAmt.textContent = cart.reduce((s,i)=>s+i.price*i.quantity,0) + ' ج.م';
            totalDiv.style.display='flex';
            checkout.style.display='block';
        }
        updateCartBadge();
    }

    function changeCartQty(i, d) {
        let cart = getCart();
        if(i>=0 && i<cart.length) {
            const item = cart[i];
            const data = loadData();
            const cat = data.categories.find(c => c.id === item.categoryId);
            const prod = cat ? cat.products.find(p => p.id === item.productId) : null;

            if(d > 0) {
                if(prod && prod.quantity > 0) {
                    prod.quantity -= 1;
                    item.quantity += 1;
                    saveCategories(data.categories);
                    saveCart(cart);
                    renderCart();
                } else showToast(`⚠️ الكمية المتاحة نفدت`,'error');
            } else {
                item.quantity -= 1;
                if(prod) prod.quantity += 1;
                if(item.quantity <= 0) cart.splice(i,1);
                saveCategories(data.categories);
                saveCart(cart);
                renderCart();
            }
        }
    }

    function removeCartItem(i) {
        let cart = getCart();
        if(i>=0 && i<cart.length) {
            const item = cart[i];
            const data = loadData();
            const cat = data.categories.find(c => c.id === item.categoryId);
            if(cat) {
                const prod = cat.products.find(p => p.id === item.productId);
                if(prod) prod.quantity += item.quantity;
            }
            cart.splice(i,1);
            saveCategories(data.categories);
            saveCart(cart);
            renderCart();
            showToast('🗑️ تم الحذف من السلة','success');
        }
    }

    function updateCartBadge() {
        const cart = getCart();
        const total = cart.reduce((s,i)=>s+i.quantity,0);
        const badge = document.getElementById('cart-badge');
        badge.textContent = total;
        badge.style.display = total>0 ? 'flex' : 'none';
    }

    // ==================== SUBMIT ORDER ====================
    function submitOrder() {
        if(!currentUser) { showToast('⚠️ يجب تسجيل الدخول أولاً', 'error'); return; }
        const cart = getCart();
        if(cart.length === 0) { showToast('⚠️ السلة فارغة', 'error'); return; }
        const paymentMethod = document.getElementById('payment-method').value;
        const deliveryAddress = document.getElementById('delivery-address').value.trim();
        if(!paymentMethod) { showToast('⚠️ اختر طريقة الدفع', 'error'); return; }
        if(!deliveryAddress) { showToast('⚠️ أدخل عنوان التوصيل', 'error'); return; }

        const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        const now = new Date();
        const dateStr = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG');
        
        const order = {
            id: 'ORD-' + Date.now(),
            username: currentUser.username,
            phone: currentUser.phone || 'غير مسجل',
            items: cart.map(i => ({ name: i.name, price: i.price, unit: i.unit || 'عدد', quantity: i.quantity, img: i.img||'📦', shipped: 0 })),
            total: total,
            paymentMethod: paymentMethod,
            deliveryAddress: deliveryAddress,
            status: 'new',
            date: dateStr,
            timestamp: now.toISOString()
        };

        const orders = getOrders();
        orders.push(order);
        saveOrders(orders);
        saveCart([]);
        updateCartBadge();
        updateOrdersBadge();
        document.getElementById('cart-overlay').classList.remove('show');
        showToast(`✅ تم إرسال طلبك بنجاح!`, 'success');
        
        document.getElementById('payment-method').value = '';
        document.getElementById('delivery-address').value = '';
        renderCart();
    }

    // ==================== ORDERS SCREEN MANAGEMENT ====================
    function updateOrdersBadge() {
        const badge = document.getElementById('orders-header-badge');
        const orders = getOrders();
        const count = orders.filter(o => o.status === 'new').length;
        if(count > 0 && currentUser && (currentUser.type === 'مدير' || currentUser.type === 'بائع')) {
            badge.textContent = count;

    function showOrderDetail(orderId) {
        const orders = getOrders();
        const order = orders.find(o => o.id === orderId);
        if(!order) return;
        if(order.status === 'new') {
            order.status = 'viewed';
            saveOrders(orders);
            updateOrdersBadge();
        }
        renderOrdersList(orderId);
        showScreen('orders');
    }

    function changeShipQty(orderId, itemIdx, delta) {
        const orders = getOrders();
        const order = orders.find(o => o.id === orderId);
        if(!order) return;
        const item = order.items[itemIdx];
        if(!item) return;

        let currentShipped = item.shipped || 0;
        let newShipped = currentShipped + delta;

        if(newShipped < 0) newShipped = 0;
        if(newShipped > item.quantity) {
            showToast(`⚠️ لا يمكن شحن أكثر من المطلوب (${item.quantity})`, 'warning');
            newShipped = item.quantity;
        }

        item.shipped = newShipped;
        saveOrders(orders);
        renderOrdersList(orderId);
    }

    function renderOrdersList(highlightId) {
        const container = document.getElementById('orders-list-container');
        const orders = getOrders();
        if(orders.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray-500);">📭 لا توجد طلبات مشتريات حتى الآن</div>';
            return;
        }
        orders.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        container.innerHTML = orders.map(o => {
            const isHighlight = o.id === highlightId;
            const statusClass = o.status === 'new' ? 'new' : (o.status === 'viewed' ? 'viewed' : 'completed');
            const statusText = o.status === 'new' ? 'جديد' : (o.status === 'viewed' ? 'تم المعاينة' : 'مكتمل');
            
            let totalShippedPieces = 0;
            let totalRemainingPieces = 0;
            let totalShippedCost = 0;

            const itemsHtml = o.items.map((item, idx) => {
                const shipped = item.shipped || 0;
                const remaining = item.quantity - shipped;
                const shippedCost = shipped * item.price;
                const remainingCost = remaining * item.price;
                const unitStr = item.unit || 'عدد';

                totalShippedPieces += shipped;
                totalRemainingPieces += remaining;
                totalShippedCost += shippedCost;

                return `
                <div class="item-row" style="background:var(--gray-50); padding:8px 10px; border-radius:var(--radius-sm); margin-bottom:6px;">
                    <div style="flex:1; min-width:110px;">
                        <strong>${item.name}</strong>
                        <div style="font-size:11px; color:var(--gray-500);">سعر الوحدة (${unitStr}): ${item.price} ج.م</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                        <span style="font-size:12px; color:var(--gray-700);">المطلوب: <strong>${item.quantity} ${unitStr}</strong></span>
                        <div style="display:inline-flex; align-items:center; gap:2px; background:white; padding:2px 6px; border-radius:20px; border:1px solid var(--gray-300);">
                            <button type="button" class="ship-btn" onclick="changeShipQty('${o.id}', ${idx}, -1)">-</button>
                            <span class="ship-qty-display">${shipped}</span>
                            <button type="button" class="ship-btn" onclick="changeShipQty('${o.id}', ${idx}, 1)">+</button>
                        </div>
                        <span style="font-size:12px; color:${remaining > 0 ? 'var(--red)' : 'var(--primary)'}; font-weight:bold;">
                            المتبقي: <strong>${remaining}</strong> ${unitStr}
                        </span>
                    </div>
                    <div style="text-align:left; min-width:90px; font-weight:bold; font-size:12px;">
                        <div style="color:var(--primary);">مشحون: ${shippedCost} ج.م</div>
                        <div style="color:${remainingCost > 0 ? 'var(--red)' : 'var(--gray-500)'};">متبقي: ${remainingCost} ج.م</div>
                    </div>
                </div>`;
            }).join('');

            const totalRemainingCost = o.total - totalShippedCost;
            const isCompleted = o.status === 'completed';

            return `
                <div class="order-card" style="${isHighlight ? 'border-right-color:var(--gold);background:#fefce8;' : ''}">
                    <div class="order-header">
                        <div class="user">👤 ${o.username} (${o.phone})</div>
                        <span class="status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="order-details">
                        <div class="detail-item"><div class="label">📅 التاريخ</div><div class="value">${o.date}</div></div>
                        <div class="detail-item"><div class="label">💳 طريقة الدفع</div><div class="value">${o.paymentMethod}</div></div>
                        <div class="detail-item"><div class="label">📍 العنوان</div><div class="value">${o.deliveryAddress}</div></div>
                        <div class="detail-item"><div class="label">📦 تم شحنه</div><div class="value" style="color:var(--primary);">${totalShippedPieces} وحدة (${totalShippedCost} ج.م)</div></div>
                        <div class="detail-item"><div class="label">⏳ المتبقي للشحن</div><div class="value" style="color:var(--red);">${totalRemainingPieces} وحدة (${totalRemainingCost} ج.م)</div></div>
                    </div>
                    <div class="order-items">
                        <div style="font-weight:bold; margin-bottom:6px; font-size:13px; color:var(--gray-700);">تحديد الكميات المشحونة:</div>
                        ${itemsHtml}
                        <div class="total-row" style="margin-top:8px;">
                            <span>إجمالي الطلب الكلي</span>
                            <span>${o.total} ج.م</span>
                        </div>
                    </div>
                    ${!isCompleted ? `
                    <div class="order-actions">
                        <button class="btn btn-success" onclick="completeOrder('${o.id}')">✅ تم التجهيز</button>
                        <button class="btn btn-danger" onclick="deleteOrder('${o.id}')">🗑️ حذف</button>
                    </div>` : `
                    <div style="background:#d4edda;padding:6px;border-radius:var(--radius-sm);text-align:center;color:#155724;font-weight:bold;font-size:13px;">✅ تم تجهيز الطلب ونقله للأرشيف</div>`}
                </div>
            `;
        }).join('');
    }

    function completeOrder(orderId) {
        if(!confirm('تأكيد تجهيز هذا الطلب ونقله للأرشيف؟')) return;
        const orders = getOrders();
        const order = orders.find(o => o.id === orderId);
        if(!order) return;

        let shippedTotal = 0;
        order.items.forEach(item => {
            const shipped = item.shipped || 0;
            shippedTotal += shipped * item.price;
        });

        const archive = getArchive();
        const archiveEntry = {
            ...order,
            archivedDate: new Date().toLocaleDateString('ar-EG') + ' ' + new Date().toLocaleTimeString('ar-EG'),
            shippedTotal: shippedTotal,
            remainingTotal: order.total - shippedTotal,
            status: 'completed'
        };
        archive.push(archiveEntry);
        saveArchive(archive);

        const updatedOrders = orders.filter(o => o.id !== orderId);
        saveOrders(updatedOrders);

        renderOrdersList();
        renderArchiveList();
        updateOrdersBadge();
        showToast(`✅ تم تجهيز الطلب ونقله للأرشيف`, 'success');
    }

    function deleteOrder(orderId) {
        if(!confirm('حذف هذا الطلب نهائياً؟')) return;
        let orders = getOrders();
        orders = orders.filter(o => o.id !== orderId);
        saveOrders(orders);
        renderOrdersList();
        updateOrdersBadge();
        showToast('🗑️ تم حذف الطلب', 'success');
    }

    function openArchiveDetail(orderId) {
        const archive = getArchive();
        const order = archive.find(o => o.id === orderId);
        if(!order) return;

        document.getElementById('archive-modal-title').textContent = `📄 تفاصيل الطلب: ${order.username}`;
        document.getElementById('archive-modal-info').innerHTML = `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                <div><strong>👤 المشتري:</strong> ${order.username}</div>
                <div><strong>📱 الهاتف:</strong> ${order.phone}</div>
                <div><strong>📅 التاريخ:</strong> ${order.archivedDate || order.date}</div>
                <div><strong>💳 طريقة الدفع:</strong> ${order.paymentMethod}</div>
                <div style="grid-column:1/-1;"><strong>📍 العنوان:</strong> ${order.deliveryAddress || 'غير محدد'}</div>
            </div>
        `;

        const tbody = document.getElementById('archive-modal-tbody');
        let totalShippedAmount = 0;

        tbody.innerHTML = (order.items || []).map(item => {
            const shipped = item.shipped !== undefined ? item.shipped : item.quantity;
            const itemShippedTotal = shipped * item.price;
            totalShippedAmount += itemShippedTotal;
            const unitStr = item.unit || 'عدد';
            return `<tr>
                <td style="text-align:right; font-weight:bold;">${item.name}</td>
                <td>${item.price} ج.م / ${unitStr}</td>
                <td>${item.quantity} ${unitStr}</td>
                <td style="color:var(--primary); font-weight:bold;">${shipped} ${unitStr}</td>
                <td>${itemShippedTotal} ج.م</td>
            </tr>`;
        }).join('');

        const remainingAmount = order.remainingTotal !== undefined ? order.remainingTotal : Math.max(0, order.total - totalShippedAmount);

        document.getElementById('archive-modal-summary').innerHTML = `
            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                <span>💰 المجموع المطلوب: <strong>${order.total} ج.م</strong></span>
                <span style="color:var(--primary-dark);">🚚 إجمالي المشحون: <strong>${totalShippedAmount} ج.م</strong></span>
                <span style="color:var(--red);">⏳ المتبقي: <strong>${remainingAmount} ج.م</strong></span>

    function saveEditedCategory() {
        const name = document.getElementById('edit-category-name').value.trim();
        const icon = document.getElementById('edit-category-icon').value.trim() || '📂';
        if(!name) return showToast('⚠️ يرجى إدخال اسم القسم', 'error');

        const data = loadData();
        if(editingCategoryId) {
            const cat = data.categories.find(c => c.id === editingCategoryId);
            if(cat) {
                cat.name = name;
                cat.icon = icon;
            }
        } else {
            const newCat = {
                id: 'cat_' + Date.now(),
                name: name,
                icon: icon,
                products: []
            };
            data.categories.push(newCat);
        }

        saveCategories(data.categories);
        closeModal('edit-category-modal');
        renderSettingsCategories();
        renderCategories(data.categories);
        showToast('✅ تم حفظ بيانات القسم بنجاح', 'success');
    }

    }

    function renderEditProductsOverlay() {
        if(!activeCategoryForProducts) return;
        const data = loadData();
        const cat = data.categories.find(c => c.id === activeCategoryForProducts);
        if(!cat) return;

        document.getElementById('edit-products-title').innerHTML = `✏️ إدارة منتجات: ${cat.icon} ${cat.name}`;
        const body = document.getElementById('edit-products-body');

        body.innerHTML = `
        <div style="background:var(--primary-light); border:1px solid var(--primary); padding:16px; border-radius:var(--radius); margin-bottom:20px;">
            <h4 style="margin-bottom:12px; color:var(--primary-dark); font-size:15px;">➕ إضافة منتج جديد لهذا القسم</h4>
            <div style="display:grid; grid-template-columns: 1fr 80px 110px 100px 100px auto; gap:10px; align-items:end;">
                <div>
                    <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">اسم المنتج</label>
                    <input type="text" id="new-prod-name" placeholder="اسم المنتج" style="width:100%; padding:8px; border:1px solid var(--gray-300); border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">الصورة</label>
                    <input type="text" id="new-prod-img" placeholder="📦" value="📦" style="width:100%; padding:8px; text-align:center; border:1px solid var(--gray-300); border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">الوحدة</label>
                    <select id="new-prod-unit" style="width:100%; padding:8px; border:1px solid var(--gray-300); border-radius:6px; font-family:inherit;">
                        <option value="كيلو جرام">كيلو جرام</option>
                        <option value="جرام">جرام</option>
                        <option value="عدد" selected>عدد</option>
                        <option value="لتر">لتر</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">السعر (ج.م)</label>
                    <input type="number" id="new-prod-price" placeholder="0" min="0" style="width:100%; padding:8px; text-align:center; border:1px solid var(--gray-300); border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">الكمية</label>
                    <input type="number" id="new-prod-qty" placeholder="0" min="0" style="width:100%; padding:8px; text-align:center; border:1px solid var(--gray-300); border-radius:6px;">
                </div>
                <button class="btn btn-primary" onclick="addNewProduct()" style="height:38px; white-space:nowrap;">➕ إضافة المنتج</button>
            </div>
        </div>

        <h4 style="margin-bottom:10px; color:var(--gray-800);">📋 منتجات القسم الحالية (${cat.products ? cat.products.length : 0}):</h4>
        ${(!cat.products || cat.products.length === 0) ? 
            '<div style="text-align:center; padding:30px; color:var(--gray-500); background:var(--gray-50); border-radius:var(--radius);">لا توجد منتجات في هذا القسم حتى الآن. يمكنك إضافة منتج جديد من الأعلى.</div>' : 
            `<div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width:70px;">الصورة</th>
                            <th>اسم المنتج</th>
                            <th style="width:120px;">الوحدة</th>
                            <th style="width:110px;">السعر (ج.م)</th>
                            <th style="width:110px;">الكمية</th>
                            <th style="width:130px;">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${cat.products.map((p) => `
                            <tr>
                                <td>
                                    <input type="text" id="prod-img-${p.id}" value="${p.img||'📦'}" style="width:100%; text-align:center; padding:6px; border:1px solid var(--gray-300); border-radius:6px; font-size:16px;">
                                </td>
                                <td>
                                    <input type="text" id="prod-name-${p.id}" value="${p.name}" style="width:100%; padding:6px 8px; border:1px solid var(--gray-300); border-radius:6px; font-weight:bold;">
                                </td>
                                <td>
                                    <select id="prod-unit-${p.id}" style="width:100%; padding:6px; border:1px solid var(--gray-300); border-radius:6px; font-family:inherit;">
                                        <option value="كيلو جرام" ${p.unit==='كيلو جرام'?'selected':''}>كيلو جرام</option>
                                        <option value="جرام" ${p.unit==='جرام'?'selected':''}>جرام</option>
                                        <option value="عدد" ${(!p.unit||p.unit==='عدد')?'selected':''}>عدد</option>
                                        <option value="لتر" ${p.unit==='لتر'?'selected':''}>لتر</option>
                                    </select>
                                </td>
                                <td>
                                    <input type="number" id="prod-price-${p.id}" value="${p.price}" min="0" style="width:100%; text-align:center; padding:6px; border:1px solid var(--gray-300); border-radius:6px; font-weight:bold; color:var(--primary-dark);">
                                </td>
                                <td>
                                    <input type="number" id="prod-qty-${p.id}" value="${p.quantity}" min="0" style="width:100%; text-align:center; padding:6px; border:1px solid var(--gray-300); border-radius:6px; font-weight:bold;">
                                </td>
                                <td>
                                    <div style="display:flex; gap:6px; justify-content:center;">
                                        <button class="btn btn-sm btn-success" onclick="saveProductRow('${p.id}')" title="حفظ تعديل هذا المنتج">💾 حفظ</button>
                                        <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.id}')" title="حذف المنتج">🗑️ حذف</button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>`
        }
        `;
    }

    function addNewProduct() {
        if(!activeCategoryForProducts) return;
        const name = document.getElementById('new-prod-name').value.trim();
        const img = document.getElementById('new-prod-img').value.trim() || '📦';
        const unit = document.getElementById('new-prod-unit').value || 'عدد';
        const price = parseFloat(document.getElementById('new-prod-price').value) || 0;
        const quantity = parseInt(document.getElementById('new-prod-qty').value) || 0;

        if(!name) return showToast('⚠️ يرجى إدخال اسم المنتج', 'error');

        const data = loadData();
        const cat = data.categories.find(c => c.id === activeCategoryForProducts);
        if(!cat) return;

        if(!cat.products) cat.products = [];

        const newProd = {
            id: 'p_' + Date.now(),
            name: name,
            img: img,
            unit: unit,
            price: price,
            quantity: quantity
        };

        cat.products.push(newProd);
        saveCategories(data.categories);
        renderEditProductsOverlay();
        renderCategories(data.categories);
        showToast('✅ تم إضافة المنتج الجديد بنجاح', 'success');
    }

    function saveProductRow(prodId) {
        if(!activeCategoryForProducts) return;
        const name = document.getElementById(`prod-name-${prodId}`).value.trim();
        const img = document.getElementById(`prod-img-${prodId}`).value.trim() || '📦';
        const unit = document.getElementById(`prod-unit-${prodId}`).value || 'عدد';
        const price = parseFloat(document.getElementById(`prod-price-${prodId}`).value) || 0;
        const quantity = parseInt(document.getElementById(`prod-qty-${prodId}`).value) || 0;

        if(!name) return showToast('⚠️ يرجى إدخال اسم المنتج', 'error');

        const data = loadData();
        const cat = data.categories.find(c => c.id === activeCategoryForProducts);
        if(!cat) return;

        const prod = cat.products.find(p => p.id === prodId);
        if(prod) {
            prod.name = name;
            prod.img = img;
            prod.unit = unit;
            prod.price = price;
            prod.quantity = quantity;
            saveCategories(data.categories);
            renderEditProductsOverlay();
            renderCategories(data.categories);
            showToast('✅ تم حفظ تعديلات المنتج', 'success');
        }
    }

    function deleteProduct(prodId) {
        if(!confirm('هل أنت تأكد من حذف هذا المنتج؟')) return;
        if(!activeCategoryForProducts) return;

        const data = loadData();
        const cat = data.categories.find(c => c.id === activeCategoryForProducts);
        if(!cat) return;

        cat.products = cat.products.filter(p => p.id !== prodId);
        saveCategories(data.categories);
        renderEditProductsOverlay();
        renderCategories(data.categories);
        showToast('🗑️ تم حذف المنتج', 'success');
    }

    // ==================== USER MANAGEMENT ====================
    function renderUsersTable() {
        const data = loadData();
        const tbody = document.getElementById('users-table-body');
        tbody.innerHTML = data.users.map((u, i) => `
            <tr>
                <td>${i + 1}</td>
                <td><strong>${u.username}</strong></td>
                <td><span style="background:var(--primary-light); color:var(--primary-dark); padding:2px 8px; border-radius:10px; font-weight:bold; font-size:11px;">${u.type}</span></td>
                <td><code>${u.password}</code></td>
                <td>${u.fullname || '-'}</td>
                <td>${u.phone || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-danger" onclick="deleteUser(${i})" ${u.username === 'admin' ? 'disabled' : ''}>🗑️ حذف</button>
                </td>
            </tr>
        `).join('');
    }

    function addNewUser() {
        const username = document.getElementById('new-user-username').value.trim();
        const password = document.getElementById('new-user-password').value.trim();
        const fullname = document.getElementById('new-user-fullname').value.trim();
        const phone = document.getElementById('new-user-phone').value.trim();
        const type = document.getElementById('new-user-type').value;

        if (!username || !password) return showToast('⚠️ اسم المستخدم وكلمة السر مطلوبان', 'error');

        const data = loadData();
        if (data.users.some(u => u.username === username)) return showToast('⚠️ اسم المستخدم موجود بالفعل', 'error');

        data.users.push({ username, password, type, fullname, phone });
        saveUsers(data.users);
        renderUsersTable();

        document.getElementById('new-user-username').value = '';
        document.getElementById('new-user-password').value = '';
        document.getElementById('new-user-fullname').value = '';
        document.getElementById('new-user-phone').value = '';
        showToast('✅ تم إضافة المستخدم بنجاح', 'success');
    }

    function deleteUser(index) {
        const data = loadData();
        if (data.users[index].username === 'admin') return showToast('⚠️ لا يمكن حذف حساب المسؤول الرئيسي', 'error');
        if (!confirm(`هل أنت تأكد من حذف المستخدم ${data.users[index].username}؟`)) return;

        data.users.splice(index, 1);
        saveUsers(data.users);
        renderUsersTable();
        showToast('🗑️ تم حذف المستخدم', 'success');
    }

    // ==================== PENDING REGISTRATION MANAGEMENT ====================
    function updatePendingBadge() {
        const pending = getPendingUsers();
        const badge = document.getElementById('pending-header-badge');
        if (badge) {
            badge.textContent = pending.length;
            badge.style.display = pending.length > 0 && currentUser && currentUser.type === 'مدير' ? 'flex' : 'none';
        }
    }

    function openPendingRequests() {
        if (!currentUser || currentUser.type !== 'مدير') return showToast('⚠️ غير مصرح لك', 'error');
        renderPendingRequests();
        document.getElementById('pending-requests-modal').classList.add('show');
    }

    function renderPendingRequests() {
        const pending = getPendingUsers();
        const list = document.getElementById('pending-requests-list');
        const countSpan = document.getElementById('pending-count');
        if (countSpan) countSpan.textContent = pending.length;

        if (pending.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--gray-500);">📭 لا توجد طلبات تسجيل معلقة</div>';
            return;
        }

        list.innerHTML = pending.map((p, i) => `
            <div class="pending-item">
                <div class="info">
                    <strong>👤 ${p.fullname}</strong>
                    <small>📱 ${p.phone} | 🕒 ${p.date}</small>
                </div>
                <div class="actions">
                    <button class="btn btn-sm btn-success" onclick="openSetPasswordModal(${i})">✅ قبول</button>
                    <button class="btn btn-sm btn-danger" onclick="rejectPendingRequest(${i})">❌ رفض</button>
                </div>
            </div>
        `).join('');
    }

    function openSetPasswordModal(index) {
        pendingAcceptIndex = index;
        const pending = getPendingUsers();
        const req = pending[index];
        document.getElementById('set-password-username').textContent = req.fullname;
        document.getElementById('set-password-input').value = '123456';
        document.getElementById('set-password-modal').classList.add('show');
    }

    function generateRandomPassword() {
        const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        let pass = '';
        for (let i = 0; i < 6; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
        document.getElementById('set-password-input').value = pass;
    }

    function confirmSetPassword() {
        if (pendingAcceptIndex === null) return;
        const pass = document.getElementById('set-password-input').value.trim();
        if (!pass) return showToast('⚠️ أدخل كلمة السر', 'error');

        const pending = getPendingUsers();
        const req = pending[pendingAcceptIndex];

        const data = loadData();
        const baseUsername = req.fullname.split(' ')[0].toLowerCase() || 'user';
        let username = baseUsername;
        let counter = 1;
        while (data.users.some(u => u.username === username)) {
            username = baseUsername + counter;
            counter++;
        }

        data.users.push({
            username: username,
            password: pass,
            type: 'مشتري',
            fullname: req.fullname,
            phone: req.phone
        });
        saveUsers(data.users);

        pending.splice(pendingAcceptIndex, 1);
        savePendingUsers(pending);

        closeModal('set-password-modal');
        renderPendingRequests();
        updatePendingBadge();
        showToast(`✅ تم قبول الطلب! اسم المستخدم: ${username} | كلمة السر: ${pass}`, 'success');
    }

    function rejectPendingRequest(index) {
        if (!confirm('هل أنت تأكد من رفض هذا الطلب؟')) return;
        const pending = getPendingUsers();
        pending.splice(index, 1);
        savePendingUsers(pending);
        renderPendingRequests();
        updatePendingBadge();
        showToast('🗑️ تم رفض الطلب', 'success');
    }

    // ==================== COMPANY SETTINGS ====================
    function saveCompanySettings() {
        const name = document.getElementById('company-name-input').value.trim();
        const logo = document.getElementById('company-logo-input').value.trim() || '🛒';
        const adminWhatsapp = document.getElementById('admin-whatsapp-input').value.trim();
        const paymentNumber = document.getElementById('company-payment-number').value.trim();

        if(!name) return showToast('⚠️ اسم الشركة مطلوب', 'error');

        localStorage.setItem('bakala_company_name', name);
        localStorage.setItem('bakala_company_logo', logo);
        localStorage.setItem('bakala_admin_whatsapp', adminWhatsapp);
        localStorage.setItem('bakala_payment_number', paymentNumber);

        document.getElementById('header-company-name').textContent = name;
        document.getElementById('login-logo').textContent = logo;
        document.getElementById('header-logo').textContent = logo;

        showToast('✅ تم حفظ إعدادات الشركة بنجاح', 'success');
    }
</script>
